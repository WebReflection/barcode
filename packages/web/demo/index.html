<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>barcode — GPU binarization demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, sans-serif;
      background: #111; color: #eee; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center;
    }
    video {
      width: 100%; max-width: 480px; aspect-ratio: 3/4; object-fit: cover;
      background: #000; border-radius: 12px;
    }
    canvas {
      width: 100%; max-width: 480px; aspect-ratio: 3/4;
      border-radius: 12px; image-rendering: pixelated; background: #000;
    }
    .row { display: flex; gap: 8px; padding: 12px; max-width: 480px; width: 100%; }
    button, select {
      flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #444;
      background: #222; color: #eee; font-size: 14px;
    }
    button:disabled { opacity: 0.5; }
    #stats { font: 12px/1.5 ui-monospace, monospace; color: #9f9; padding: 4px 12px 16px; white-space: pre-wrap; }
    h1 { font-size: 15px; font-weight: 600; margin: 14px 0 2px; color: #aaa; }
  </style>
</head>
<body>
  <h1>barcode — WebGPU binarization demo</h1>
  <div class="row">
    <button id="start" disabled>starting…</button>
    <button id="torch" disabled>torch</button>
    <select id="lens">
      <option value="default">default lens</option>
      <option value="wide" selected>wide</option>
      <option value="ultrawide">ultra-wide</option>
    </select>
  </div>
  <video id="video" playsinline muted></video>
  <canvas id="mask" width="320" height="427"></canvas>
  <div id="stats">waiting for camera…</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
