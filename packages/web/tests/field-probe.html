<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>field probe</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; font: 14px/1.4 ui-monospace, monospace; background: #111; color: #eee; }
  #result { white-space: pre-wrap; }
  canvas { max-width: 100%; height: auto; margin-top: 12px; }
</style>
</head>
<body>
<div id="result">loading…</div>
<canvas id="preview"></canvas>
<script type="module">
/**
 * Dev-only still-image probe: loads a local file through the PUBLIC
 * scan({ image }) path (GPU binarizer, still ladder) and prints the
 * result. The image path may be absolute (Vite /@fs/) — field photos are
 * personal, local-only, never committed.
 *
 *   /field-probe.html?img=/@fs/…/P_20261117_112238.jpg[&max=2112][&type=code128]
 */
import barcode from "../api/main.js";

const q = new URLSearchParams(location.search);
const imgPath = q.get("img");
const max = Number(q.get("max") ?? 2112);
const types = q.get("type");
const result = /** @type {HTMLElement} */ (document.getElementById("result"));
const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById("preview"));

const report = (s) => { result.textContent = s; document.title = s.split("\n")[0]; };

try {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = imgPath;
  await img.decode();
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  const ctx = /** @type {CanvasRenderingContext2D} */ (canvas.getContext("2d"));
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  const { scan } = barcode({});
  const opts = { image: canvas, latency: 20000 };
  if (types) opts.type = types.split(",");
  const t0 = performance.now();
  const code = await scan(opts);
  const ms = Math.round(performance.now() - t0);
  report(code
    ? `${code.symbology}: ${code.text}\n${canvas.width}x${canvas.height} · ${ms}ms`
    : `no read\n${canvas.width}x${canvas.height} · ${ms}ms`);
} catch (err) {
  report(`ERROR: ${err}`);
}
</script>
</body>
</html>
