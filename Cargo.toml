[workspace]
resolver = "2"
members = [
    "crates/barcode-core",
    "crates/barcode-qr",
    "crates/barcode-ean13",
    "crates/barcode-code39",
    "crates/barcode-code128",
    "crates/barcode-code93",
    "crates/barcode-codabar",
    "crates/barcode-ean8",
    "crates/barcode-upce",
    "crates/barcode-dm",
    "crates/barcode-aztec",
    "crates/barcode-pdf417",
    "crates/barcode-microqr",
    "crates/barcode-itf",
    "crates/barcode-databar",
    "crates/barcode-fixtures",
    "crates/barcode-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/WebReflection/barcode"

[workspace.dependencies]
barcode-core = { path = "crates/barcode-core" }

[profile.release]
# Keep non-hot crates (encoders/fixtures, serde, wasm-bindgen glue) small while
# compiling the hot decoders at opt-level = 3 (with Micro QR algorithmic,
# wasm.wasm is still less than half the 1.85 MB budget).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.barcode-core]
opt-level = 3
[profile.release.package.barcode-qr]
opt-level = 3
[profile.release.package.barcode-microqr]
opt-level = 3
[profile.release.package.barcode-dm]
opt-level = 3
[profile.release.package.barcode-aztec]
opt-level = 3
[profile.release.package.barcode-pdf417]
opt-level = 3
[profile.release.package.barcode-ean13]
opt-level = 3
[profile.release.package.barcode-ean8]
opt-level = 3
[profile.release.package.barcode-upce]
opt-level = 3
[profile.release.package.barcode-code128]
opt-level = 3
[profile.release.package.barcode-code93]
opt-level = 3
[profile.release.package.barcode-code39]
opt-level = 3
[profile.release.package.barcode-itf]
opt-level = 3
[profile.release.package.barcode-codabar]
opt-level = 3
[profile.release.package.barcode-databar]
opt-level = 3
[profile.release.package.barcode-wasm]
opt-level = 3
